meta:
  title: "Agape Farmstead — Brand Sustainability & Growth"
  description: "Long-term proposal for sustainable brand growth: regenerative land stewardship, community roots, and a multi-year roadmap for Agape Farmstead."
  og_title: "Agape Farmstead — Brand Sustainability & Growth"
  og_description: "A five-year vision: land, community, and commerce working together for a farm that outlasts any single season."
  theme_color: "#0d1f17"
  forest: "#0d1f17"
  forest_mid: "#143528"
  accent: "#3fb950"
  accent_dim: "#2a7d3a"
  cream: "#f0f6fc"
  muted: "#8ba3b0"
  card_bg: "#12261c"
  accent2: "#5b9bd5"

slides:
  - tag: "Five-Year Brand Vision"
    title: "Built to __ACCENT__Last.__"
    subtitle: "Agape Farmstead isn't a seasonal business with a website. It's a regenerative operation with a mission — and this proposal maps how the brand grows without losing what makes it Agape."
    stats:
      - n: "5"
        l: "Year Horizon"
      - n: "3"
        l: "Pillars"
      - n: "1"
        l: "Promise"

  - tag: "Three Pillars"
    title: "Three Pillars"
    cards:
      - pillar: "Land"
        pillar_class: "land"
        title: "Stewardship First"
        text: "Soil health, rotational grazing, and River Friendly certification aren't marketing — they're the operating system. The land improves every year, which means the product does too."
      - pillar: "People"
        pillar_class: "people"
        title: "Community as Infrastructure"
        text: "Farmers market regulars, student interns, church networks, and delivery customers form a moat no competitor can buy. Relationships compound faster than ad spend."
      - pillar: "Purpose"
        pillar_class: "purpose"
        title: "Faith-Driven Consistency"
        text: "The biblical foundation gives the brand a spine. In a market full of wellness claims, Agape offers something deeper — and that depth is what people remember and share."

  - tag: "Year One"
    timeline: "Months 1–12"
    title: "Foundation"
    list:
      - "SEO and local visibility (Clarksville pilot) — own the home turf first"
      - "Thanksgiving delivery expansion — prove the 200-mile model with one high-stakes season"
      - "Launch email list and basic CRM to capture every customer relationship"
      - "Document the farm: photo library, short videos, founder story on video"
      - "Formalize the River Friendly and regenerative certifications in all marketing"
    subtitle: "Year one is about being findable and memorable. Nothing else matters until those two are true."

  - tag: "Year Two"
    timeline: "Months 13–24"
    title: "Channels"
    list:
      - "Expand delivery to year-round: eggs, seasonal meat boxes, holiday specials"
      - "Wholesale conversations with Nashville restaurants and natural grocers"
      - "Launch a simple subscription model for eggs and monthly meat shares"
      - "Begin content cadence: monthly farm updates, seasonal guides, behind-the-scenes"
      - "Explore agritourism: farm visits, school field trips tied to the internship program"
    subtitle: "Year two turns one-time buyers into recurring relationships across multiple revenue streams."

  - tag: "Year Three"
    timeline: "Months 25–36"
    title: "Scale"
    list:
      - "Evaluate second processing or butchering partnership to remove bottlenecks"
      - "Hire or contract a part-time brand/marketing role — founder time shifts to land and livestock"
      - "Expand the internship program into a named pipeline for future farm labor"
      - "Test adjacent products: value-added items, apparel, or branded goods"
      - "Measure everything: customer lifetime value, repeat rate, cost per acquisition by channel"
    subtitle: "Year three is when the brand stops being a farm with a side hustle and becomes a business with a farm at its heart."

  - tag: "Years Four & Five"
    timeline: "Months 37–60"
    title: "Legacy"
    list:
      - "Regional recognition: the regenerative farm of Middle Tennessee as a default search result"
      - "Potential second location or satellite market presence in Nashville"
      - "Formalize succession and land-trust or easement planning if multi-generational"
      - "Publish the farm's regenerative data — soil tests, carbon impact — as open proof"
      - "The brand outlives any single product line because it's built on land and trust"
    subtitle: "By year five, Agape isn't competing on price. It's the name people trust when they ask, who's raising food the right way around here?"

  - tag: "What Sustainability Really Means"
    title: "What Sustainability Really Means"
    cards:
      - title: "Ecological"
        text: "Rotational grazing rebuilds soil, sequesters carbon, protects waterways. The River Friendly certification is the receipt."
      - title: "Economic"
        text: "Diversified revenue — retail, delivery, wholesale, subscriptions — means no single channel failing sinks the farm."
    cards_extra:
      - title: "Cultural"
        text: "A brand rooted in faith, family, and community doesn't chase trends. It outlasts them. That's the moat."
    subtitle: "Most farms optimize for this quarter. Agape's advantage is optimizing for the next fifty years."

  - tag: "The Ask"
    title: "The Ask"
    subtitle: "Adopt the five-year roadmap as the shared vision. Start with Year One commitments: SEO pilot, Thanksgiving delivery, and the email list. Review progress quarterly and adjust the plan as the data comes in."
    ask:
      title: "Five-Year Partnership"
      text: "Quarterly strategy reviews, annual roadmap refresh, and a shared dashboard tracking land health, customer growth, and revenue diversification."
      button: "Start the Conversation"
      button_href: "mailto:agapefarmstead@outlook.com?subject=Agape%20Farmstead%20Five-Year%20Growth%20Proposal"
    footer: "Prepared for Agape Farmstead · Clarksville / Adams, TN · (931) 272-1269"

  - tag: "The Long View"
    title: "Plant Trees<br>You'll Never<br>__ACCENT__Sit Under.__"
    subtitle: "Agape Farmstead already lives this. The proposal just names it, sequences it, and gives every decision a place in the story."
    list:
      - "Year One starts now — SEO, Thanksgiving, email list"
      - "Full roadmap: agapefarmstead.com or call (931) 272-1269"
    footer: "agapefarmstead.com · agapefarmstead@outlook.com"
