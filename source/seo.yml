meta:
  title: "Agape Farmstead — SEO & Content Proposal"
  description: "Proposal to improve Agape Farmstead's search visibility and content reach through technical SEO, local optimization, and regenerative storytelling."
  og_title: "Agape Farmstead — SEO & Content Proposal"
  og_description: "Three-phase plan: quick on-page wins, local visibility with Google Business Profile, and a content calendar built on regenerative and faith-driven differentiation."
  theme_color: "#3d4a2c"

slides:
  - tag: "SEO & Content Audit"
    title: "Findable Where<br>It __ACCENT__Matters.__"
    subtitle: "Agape Farmstead has a strong story and real certifications — but the site is under-optimized for search. This proposal closes that gap in three phases."
    stats:
      - n: "0"
        l: "Meta Descriptions"
      - n: "No"
        l: "LocalBusiness Schema"
      - n: "1"
        l: "GBP Listing"

  - tag: "What's Working"
    title: "What's Working"
    list:
      - "Clear mission: regenerative, faith-driven, River Friendly Farm certified"
      - "Useful product copy — pasture-raised chicken, eggs, lamb, pork, turkey, dog supplements"
      - "Correct canonicals, working sitemap, standard Squarespace robots.txt"
      - "Some product images have meaningful alt text"
      - "Strong external credibility: Cumberland River Compact backlink"

  - tag: "What's Holding It Back"
    title: "What's Holding It Back"
    cards:
      - title: "Titles & Snippets"
        text: "Homepage title is just the brand name. No location, no keywords. Meta descriptions are missing entirely — Google auto-generates poor snippets."
      - title: "Local Signals"
        text: "Clarksville appears only in the footer. No street address, map, or service area. No Google Business Profile surfaced — a major gap for near-me searches."
      - title: "Structure"
        text: "Multiple H1s on the homepage. Many images lack alt text. No structured data for LocalBusiness, Product, or Organization."

  - phase: "01"
    timeline: "Weeks 1–2 · Quick Wins"
    title: "On-Page Foundations"
    list:
      - "Rewrite titles: brand + location + primary offer (e.g., Pasture-Raised Meat | Agape Farmstead | Clarksville, TN)"
      - "Write 150–160 character meta descriptions for homepage, products, and story pages"
      - "One H1 per page; add alt text to every image"
      - "Add LocalBusiness schema: name, address or service area, phone, email, URL"

  - phase: "02"
    timeline: "Weeks 2–4 · Local Visibility"
    title: "Get Found Nearby"
    list:
      - "Claim and fully optimize a Google Business Profile: categories (Farm, Meat Shop), photos, products, hours, website link"
      - "Encourage reviews that mention location and products"
      - "Strengthen location mentions naturally: Adams, Clarksville, Middle Tennessee, within 50 miles"
      - "Add an ordering FAQ section targeting local queries"

  - phase: "03"
    timeline: "Months 2–3 · Content"
    title: "Tell the Story"
    list:
      - "Content calendar: 4–6 seasonal posts — market days, certifications, regenerative practices, student internships"
      - "Lean into the differentiator: regenerative + River Friendly + faith-driven"
      - "Link to the Cumberland River Compact profile where appropriate"
      - "Track rankings for long-tails: pasture-raised chicken Clarksville TN, River Friendly Farm Adams"

  - tag: "The Differentiation"
    title: "Nobody Else Combines<br>All Three."
    subtitle: "Regenerative practices. River Friendly Farm certification. Faith-driven mission. That combination is the moat — once the technical basics are in place, content should hammer it."
    cards:
      - title: "Search Intent"
        text: "Buyers searching local meat want provenance they can verify. Agape can answer that better than any big-box freezer aisle."
      - title: "Winnable Keywords"
        text: "Broad terms like farm store near me are crowded. Specific long-tails — River Friendly Farm Adams, pasture-raised turkey Clarksville — are realistic targets."

  - tag: "The Ask"
    title: "The Ask"
    subtitle: "Start with Phase 1 as a fixed-scope pilot: meta titles, descriptions, heading cleanup, alt text, and schema. Prove the lift, then commit to local visibility and content."
    ask:
      title: "Phase 1 Pilot"
      text: "Fixed scope, defined deliverables, two-week timeline. Review results before moving to Phase 2."
      button: "Start Phase 1"
      button_href: "mailto:agapefarmstead@outlook.com?subject=Agape%20Farmstead%20SEO%20Phase%201%20Pilot"
    footer: "Prepared for Agape Farmstead · Clarksville / Adams, TN · (931) 272-1269"

  - tag: "Next Step"
    title: "Own Your<br>__ACCENT2__Search Results.__"
    subtitle: "The farm is already doing the hard part — raising food the right way. This proposal makes sure people searching for exactly that can find it."
    list:
      - "Phase 1 scope and timeline available on request"
      - "Or call (931) 272-1269 to talk it through"
    footer: "agapefarmstead.com · agapefarmstead@outlook.com"
